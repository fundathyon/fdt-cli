[package]
name = "fdt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "fdt: la infraestructura de tu organización en Foundathyon desde la terminal"
publish = false

[[bin]]
name = "fdt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
directories = "6.0"
gethostname = "1.0"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
open = "5"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
self-replace = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "io-std"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14"
wiremock = "0.6"
