# Push a vX.Y.Z tag (matching `version` in Cargo.toml) to publish fdt on GitHub Releases:
#
#   fdt-x86_64-unknown-linux-musl.tar.gz    fdt-aarch64-unknown-linux-musl.tar.gz   (static, any distro)
#   fdt-x86_64-apple-darwin.tar.gz          fdt-aarch64-apple-darwin.tar.gz
#   fdt-x86_64-pc-windows-msvc.zip
#   <each archive>.sha256, SHA256SUMS, install.sh, setup.sh, install.ps1
#
# install.sh, install.ps1 and `fdt update` (src/update.rs) read exactly these names. A tag with a
# suffix (v0.2.0-rc.1) is published as a prerelease, which `releases/latest` (and so the installers
# and `fdt update`) ignore. See RELEASING.md.

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check tag, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches Cargo.toml
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "fdt") | .version')"
          if [ "v${crate}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::El tag ${GITHUB_REF_NAME} no coincide con la versión de Cargo.toml (${crate}). Sube Cargo.toml a ${GITHUB_REF_NAME#v} o etiqueta v${crate}."
            exit 1
          fi
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # smoke: the runner can execute what it just built.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
    runs-on: ${{ matrix.os }}
    env:
      # `fdt --version` prints the tag (src/lib.rs reads it at build time).
      FDT_VERSION: ${{ github.ref_name }}
      # Link the MSVC runtime statically, so fdt.exe needs no Visual C++ Redistributable.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      # No ._* AppleDouble files inside the macOS tarballs.
      COPYFILE_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal --target "${{ matrix.target }}" && rustup default stable
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          mkdir -p stage dist
          cp "target/${{ matrix.target }}/release/fdt" LICENSE stage/
          tar -czf "dist/fdt-${{ matrix.target }}.tar.gz" -C stage fdt LICENSE
          tar -tzvf "dist/fdt-${{ matrix.target }}.tar.gz"
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fdt.exe", LICENSE stage/
          Compress-Archive -Path stage/fdt.exe, stage/LICENSE -DestinationPath "dist/fdt-${{ matrix.target }}.zip"

      - name: Linux binary is static
        if: matrix.musl
        run: |
          file stage/fdt
          file stage/fdt | grep -Eq 'statically linked|static-pie linked'
      - name: macOS binary has the right architecture
        if: runner.os == 'macOS'
        run: |
          lipo -archs stage/fdt
          case "${{ matrix.target }}" in
            x86_64-*) [ "$(lipo -archs stage/fdt)" = "x86_64" ] ;;
            # Apple silicon refuses to run an unsigned binary; the linker signs arm64 ad hoc.
            # It does not sign x86_64, and Intel Macs do not need it.
            aarch64-*)
              [ "$(lipo -archs stage/fdt)" = "arm64" ]
              codesign --verify --verbose stage/fdt
              ;;
          esac
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          exe="stage/fdt"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="stage/fdt.exe"; fi
          out="$("$exe" --version)"
          echo "$out"
          [ "$out" = "fdt ${GITHUB_REF_NAME}" ]
          "$exe" --help > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: fdt-*
          merge-multiple: true
      - name: Checksums and installers
        working-directory: dist
        run: |
          expected="fdt-aarch64-apple-darwin.tar.gz fdt-aarch64-unknown-linux-musl.tar.gz fdt-x86_64-apple-darwin.tar.gz fdt-x86_64-pc-windows-msvc.zip fdt-x86_64-unknown-linux-musl.tar.gz"
          actual="$(find . -maxdepth 1 -type f -name 'fdt-*' | sed 's#^\./##' | sort | tr '\n' ' ' | sed 's/ $//')"
          [ "$actual" = "$expected" ] || { ls -l; echo "::error::Se esperaba: $expected; llegó: $actual"; exit 1; }
          sha256sum fdt-* > SHA256SUMS
          for f in fdt-*; do grep " ${f}\$" SHA256SUMS > "${f}.sha256"; done
          cp ../install.sh ../setup.sh ../install.ps1 .
          cat SHA256SUMS
          ls -l
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "fdt ${GITHUB_REF_NAME}" --generate-notes $prerelease

  # Installs the release just published, the way a participant would, on each OS.
  verify-install:
    name: Install on ${{ matrix.os }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FDT_INSTALL_VERSION: ${{ github.ref_name }}
    steps:
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          export FDT_INSTALL_DIR="$RUNNER_TEMP/fdt-bin"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" | sh
          [ "$("$FDT_INSTALL_DIR/fdt" --version)" = "fdt ${GITHUB_REF_NAME}" ]
      - name: setup.sh (without login)
        if: runner.os != 'Windows'
        run: |
          export HOME="$RUNNER_TEMP/fdt-home" FDT_INSTALL_DIR="$RUNNER_TEMP/fdt-home/bin" FDT_SKIP_LOGIN=1
          mkdir -p "$HOME"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/setup.sh" | sh
          [ "$("$FDT_INSTALL_DIR/fdt" --version)" = "fdt ${GITHUB_REF_NAME}" ]
          [ -f "$HOME/.claude/skills/fdt-basics/SKILL.md" ]
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:FDT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "fdt-bin"
          irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/install.ps1" | iex
          $out = & (Join-Path $env:FDT_INSTALL_DIR "fdt.exe") --version
          if ($out -ne "fdt $env:GITHUB_REF_NAME") { throw "fdt --version dijo: $out" }
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:FDT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "fdt-bin-51"
          irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/install.ps1" | iex
          & (Join-Path $env:FDT_INSTALL_DIR "fdt.exe") --version
